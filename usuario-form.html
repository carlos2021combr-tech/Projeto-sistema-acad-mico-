<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cadastro de Usuário - Sistema Acadêmico</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <h1>Sistema de Gerenciamento Acadêmico</h1>
  </header>

  <nav>
    <a href="index.html">Dashboard</a>
    <a href="alunos.html">Alunos</a>
    <a href="cursos.html">Cursos</a>
    <a href="matriculas.html">Matrículas</a>
    <a href="usuarios.html">Usuários</a>
  </nav>

  <main>
    <h2>Cadastro de Usuário</h2>

    <form action="#" method="post">

      <fieldset>
        <legend>Dados do Usuário</legend>

        <label for="nomeUsuario">Nome completo</label>
        <input type="text" id="nomeUsuario" name="nomeUsuario" placeholder="Digite o nome do usuário">

        <label for="emailUsuario">E-mail</label>
        <input type="email" id="emailUsuario" name="emailUsuario" placeholder="usuario@exemplo.com">

        <label for="perfil">Perfil de acesso</label>
        <select id="perfil" name="perfil">
          <option value="">Selecione um perfil</option>
          <option value="admin">Administrador</option>
          <option value="professor">Professor</option>
          <option value="secretaria">Secretaria</option>
        </select>

        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="Digite uma senha">
      </fieldset>

      <button type="submit">Salvar</button>
      <button type="reset" class="botao-secundario">Limpar</button>

    </form>
  </main>

  <footer>
    <p>&copy; 2026 Sistema de Gerenciamento Acadêmico - Univest</p>
  </footer>

</body>
</html>
