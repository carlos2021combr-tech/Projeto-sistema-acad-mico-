<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cadastro de Curso - Sistema Acadêmico</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <h1>Sistema de Gerenciamento Acadêmico</h1>
  </header>

  <nav>
    <a href="index.html">Dashboard</a>
    <a href="alunos.html">Alunos</a>
    <a href="cursos.html">Cursos</a>
    <a href="matriculas.html">Matrículas</a>
    <a href="usuarios.html">Usuários</a>
  </nav>

  <main>
    <h2>Cadastro de Curso</h2>

    <form action="#" method="post">

      <fieldset>
        <legend>Dados do Curso</legend>

        <label for="nomeCurso">Nome do curso</label>
        <input type="text" id="nomeCurso" name="nomeCurso" placeholder="Digite o nome do curso">

        <label for="cargaHoraria">Carga horária (horas)</label>
        <input type="number" id="cargaHoraria" name="cargaHoraria" placeholder="Ex: 3200">

        <label for="turno">Turno</label>
        <select id="turno" name="turno">
          <option value="">Selecione um turno</option>
          <option value="matutino">Matutino</option>
          <option value="noturno">Noturno</option>
          <option value="integral">Integral</option>
        </select>
      </fieldset>

      <button type="submit">Salvar</button>
      <button type="reset" class="botao-secundario">Limpar</button>

    </form>
  </main>

  <footer>
    <p>&copy; 2026 Sistema de Gerenciamento Acadêmico - Univest</p>
  </footer>

</body>
</html>
